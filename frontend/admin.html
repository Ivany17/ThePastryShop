<!-- admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>The Pastry Shop — Admin</title>
</head>
<body>
    <div id="form-container">
        <input type="text" id="inputNameOfTheProduct" placeholder="Name Of The Product">
        <textarea id="descriptionOfTheProduct" placeholder="Description Of The Product"></textarea>
        <input type="number" id="inputPriceOfTheProduct" placeholder="Price Of The Product">
        <label for="product-categories">Categories</label>
        <select id="product-categories" name="categories">
            <option value="cake">Cake</option>
            <option value="pastry">Pastry</option>
            <option value="cookie">Cookie</option>
        </select>
        <input type="url" id="inputPhotoOfTheProduct" placeholder="Photo Of The Product">
        <button id="addProductBtn">Add Product</button>
    </div>
    <div id="products-container">

    </div>

    <div class="modal-overlay">
        <div class="modal-content">
            <input type="text" id="editNameOfTheProduct" placeholder="Change Name Of The Product">
            <textarea id="editDescriptionOfTheProduct" placeholder="Change Description Of The Product"></textarea>
            <input type="number" id="editPriceOfTheProduct" placeholder="Change Price Of The Product">
            <label for="edit-product-categories">Categories</label>
            <select id="edit-product-categories" name="categories">
                <option value="cake">Cake</option>
                <option value="pastry">Pastry</option>
                <option value="cookie">Cookie</option>
            </select>
            <input type="url" id="editPhotoOfTheProduct" placeholder="Change Photo Of The Product">
            <button id="editProductBtn">Edit Product</button>
            <button id="cancelBtn">Cancel</button>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
